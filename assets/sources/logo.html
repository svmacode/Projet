<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
body{width:1600px;height:800px;position:relative;overflow:hidden}

</style></head><body>
<svg width="1600" height="800" viewBox="0 0 1600 800">
 <defs>
  <linearGradient id="gy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF2A8"/><stop offset=".55" stop-color="#FFD42A"/><stop offset="1" stop-color="#F5A300"/></linearGradient>

  <radialGradient id="ballg" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFF4B0"/><stop offset=".5" stop-color="#FFD42A"/><stop offset="1" stop-color="#E89A00"/></radialGradient>
 </defs>
 <!-- balle -->
 <g transform="translate(1290,250) rotate(18)">
  <circle r="200" fill="url(#ballg)" stroke="#101016" stroke-width="16"/>
  <path d="M-196,-30 C-80,40 80,40 196,-30" fill="none" stroke="#E2203A" stroke-width="26"/>

 </g>
 <!-- lignes de vitesse -->
 <g stroke="#101016" stroke-width="10" stroke-linecap="round">
  <line x1="1520" y1="120" x2="1590" y2="70"/><line x1="1540" y1="230" x2="1600" y2="215"/><line x1="1500" y1="380" x2="1580" y2="420"/>
 </g>
 <!-- HANDBALL -->
 <g font-family="Bangers" font-size="270" letter-spacing="6" transform="rotate(-4 760 260)">
  <text x="70" y="330" fill="#101016" stroke="#101016" stroke-width="34" stroke-linejoin="round" transform="translate(18,18)">HANDBALL</text>
  <text x="70" y="330" fill="#9A0C20" stroke="#101016" stroke-width="34" stroke-linejoin="round" transform="translate(9,9)">HANDBALL</text>
  <text x="70" y="330" fill="url(#gy)" stroke="#101016" stroke-width="18" stroke-linejoin="round" paint-order="stroke fill">HANDBALL</text>
 </g>
 <!-- LEGENDS -->
 <g font-family="Bangers" font-size="250" letter-spacing="10" transform="rotate(-4 760 560)">
  <text x="200" y="600" fill="#101016" stroke="#101016" stroke-width="34" stroke-linejoin="round" transform="translate(18,18)">LEGENDS</text>
  <text x="200" y="600" fill="#9A0C20" stroke="#101016" stroke-width="34" stroke-linejoin="round" transform="translate(9,9)">LEGENDS</text>
  <text x="200" y="600" fill="url(#gw)" stroke="#101016" stroke-width="18" stroke-linejoin="round" paint-order="stroke fill">LEGENDS</text>
 </g>
 <!-- bandeau japonais -->
 <g transform="rotate(-4 800 720)">
  <rect x="380" y="668" width="840" height="96" fill="#101016" transform="translate(10,10)"/>

 </g>
